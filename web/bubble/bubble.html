<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>bubble</title>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
  }

  #b {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 14px;
    padding: 8px 14px;
    background: #fff;
    border: 0.5px solid rgba(74, 85, 104, 0.14);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
    color: #3c4655;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  #b.on {
    opacity: 1;
    transform: none;
  }

  #b::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    width: 11px;
    height: 11px;
    background: #fff;
    border-right: 0.5px solid rgba(74, 85, 104, 0.14);
    border-bottom: 0.5px solid rgba(74, 85, 104, 0.14);
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div id="b"></div>
  <script>
    const T = window.__TAURI__;
    const b = document.getElementById('b');

    function say(text) {
      b.textContent = text;
      // 强制重排，保证连续两次点击也能重新播放动画
      void b.offsetHeight;
      b.classList.add('on');
    }

    if (T && T.event) {
      T.event.listen('bubble:say', (e) => say(e.payload));
      T.event.listen('bubble:hide', () => b.classList.remove('on'));
    }
  </script>
</body>
</html>
